
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Gestión de Usuarios</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <header class="encabezado">
        <h1>Panel de Gestión de Usuarios</h1>
        <p>Administra, consulta y organiza los usuarios.</p>
    </header>

    <main class="contenedor">

        <!-- Formulario para registrar y editar usuarios -->
        <section class="tarjeta">
            <h2>Registrar usuario</h2>

            <form id="formulario-usuario">
                <div class="grupo-campos">

                    <div class="campo">
                        <label for="id">ID del usuario</label>
                        <input type="number" id="id" min="1" step="1" required>
                    </div>

                    <div class="campo">
                        <label for="nombre">Nombre completo</label>
                        <input type="text" id="nombre" required>
                    </div>

                    <div class="campo">
                        <label for="correo">Correo electrónico</label>
                        <input type="email" id="correo" required>
                    </div>

                    <div class="campo">
                        <label for="ciudad">Ciudad</label>
                        <select id="ciudad" required>
                            <option value="">Selecciona una ciudad</option>
                            <option value="Barranquilla">Barranquilla</option>
                            <option value="Bogotá">Bogotá</option>
                            <option value="Cartagena">Cartagena</option>
                            <option value="Medellín">Medellín</option>
                            <option value="Cali">Cali</option>
                            <option value="Santa Marta">Santa Marta</option>
                            <option value="Bucaramanga">Bucaramanga</option>
                            <option value="Valledupar">Valledupar</option>
                            <option value="Sincelejo">Sincelejo</option>
                            <option value="Montería">Montería</option>
                            <option value="Riohacha">Riohacha</option>
                            <option value="Pereira">Pereira</option>
                            <option value="Manizales">Manizales</option>
                            <option value="Armenia">Armenia</option>
                            <option value="Cúcuta">Cúcuta</option>
                        </select>
                    </div>

                </div>

                <div class="acciones-formulario">
                    <button type="submit" id="btn-guardar">
                        Agregar usuario
                    </button>

                    <button type="button" id="btn-cancelar" hidden>
                        Cancelar edición
                    </button>
                </div>
            </form>
        </section>

        <!-- Buscador -->
        <section class="tarjeta">
            <h2>Buscar usuarios</h2>

            <label for="buscador">Buscar por nombre</label>
            <input
                type="text"
                id="buscador"
                placeholder="Escribe un nombre..."
            >
        </section>

        <!-- Tabla de usuarios -->
        <section class="tarjeta">
            <h2>Lista de usuarios</h2>

            <p id="mensaje" role="status" aria-live="polite">
                Preparando la lista de usuarios...
            </p>

            <div class="tabla-contenedor">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Correo</th>
                            <th>Ciudad</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>

                    <tbody id="tabla-usuarios">
                        <!-- Las filas se generan con JavaScript -->
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <footer>
        <p>Panel de Gestión de Usuarios | Proyecto académico</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
